<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eugene’s Apps</title>
  <meta name="description" content="個人で作ったアプリの一覧です。">
  <meta property="og:title" content="eugene’s Apps">
  <meta property="og:description" content="個人で作ったアプリの一覧です。">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light dark">
  <script>
    // 保存済みのテーマを描画前に反映（ちらつき防止）
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="./">eugene’s Apps</a>
      <button class="theme-toggle" type="button" aria-label="ライト／ダークモードを切り替え">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h1>Apps</h1>
      <p>個人で作ったアプリの一覧です。</p>
    </section>

    <ul class="app-grid" id="app-grid"></ul>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year"></span> eugene</span>
      <a href="https://github.com/eu-33-gene" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
